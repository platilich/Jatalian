{% extends "base.html" %}
{% block title %}Study Words — Jatalian{% endblock %}
{% block content %}
    <div class="card main-card">
        <!-- User Bar -->
        <div class="user-bar">
            <span class="user-name">Hi, <strong>{{ request.user.get_full_name|default:request.user.username }}</strong></span>
            <form action="{% url 'account_logout' %}" method="post" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="btn-logout">Log Out</button>
            </form>
        </div>

        <!-- Tabs -->
      <div class="tabs">
          <a href="{% url 'home' %}" class="tab {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Practice</a>
          <a href="{% url 'vocabulary' %}" class="tab {% if request.resolver_match.url_name == 'vocabulary' %}active{% endif %}">Vocabulary</a>
          <a href="{% url 'new_word' %}" class="tab {% if request.resolver_match.url_name == 'new_word' %}active{% endif %}">Add new word</a>
      </div>



        <!-- Add New Word Form -->
        <div class="add-word-section">
            <h3>Add New Word</h3>
            <form method="post" action="{% url 'home' %}" class="add-word-form">
                {% csrf_token %}
                <input type="text" name="italian" placeholder="Italian word" required>
                <input type="text" name="translation" placeholder="Translation" required>
                <button type="submit" class="btn-add">Add</button>
            </form>
        </div>
    </div>
{% endblock %}
