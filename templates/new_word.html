{% extends "base.html" %}
{% load static %}

{% block title %}Add New Word — Jatalian{% endblock %}

{% block custom_style %}
    <link rel="stylesheet" href="{% static 'css/new_word.css' %}">
{% endblock %}

{% block content %}
    <div class="add-word-box">
        <h1>Add New Word</h1>
        <p class="add-word-hint">Italian word + translation</p>

        <form method="post" action="{% url 'new_word' %}" class="form-grid">
            {% csrf_token %}

            <div class="form-group">
                <label for="italian">Italian word</label>
                <input type="text" id="italian" name="italian" placeholder="e.g. Ciao" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="translation">Translation</label>
                <input type="text" id="translation" name="translation" placeholder="e.g. Hello" required autocomplete="off">
            </div>

            <button type="submit" class="btn btn-primary">Add Word</button>
        </form>
    </div>
{% endblock %}
